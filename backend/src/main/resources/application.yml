spring:
  application:
    name: training-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/training_platform?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:training_user}
    password: ${SPRING_DATASOURCE_PASSWORD:training_password}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ramzii.jomaa@gmail.com}
    password: ${MAIL_PASSWORD:wekdxazsdjkpbmwa}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost,http://localhost:80}
  mail:
    from: ${MAIL_FROM:ramzii.jomaa@gmail.com}
  upload:
    cv-dir: ${CV_UPLOAD_DIR:uploads/cvs}
  attendance:
    threshold-percent: 70
    heartbeat-interval-sec: 30
    stale-after-sec: 90
    jitsi-domain: meet.jit.si
  ml:
    enabled: ${APP_ML_ENABLED:true}
    base-url: ${APP_ML_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: training-platform
