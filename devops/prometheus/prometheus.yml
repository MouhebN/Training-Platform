global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: training-platform-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          app: training-platform
          service: backend

  - job_name: docker-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ['docker-exporter:9487']
        labels:
          app: containers
